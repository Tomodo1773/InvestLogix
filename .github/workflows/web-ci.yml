name: Web CI (Biome&Vitest)

on:
  push:
    branches: ["main"]
    paths:
      - "src/web/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
    paths:
      - "src/web/**"
  workflow_dispatch:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "src/web/pnpm-lock.yaml"

      - name: Setup Socket Firewall
        uses: socketdev/action@937f824ec476dfd164d4a4d9995751427b0be143 # v1
        with:
          mode: firewall

      - name: Install dependencies
        working-directory: src/web
        run: sfw pnpm install --frozen-lockfile

      - name: Run Biome CI (lint + format)
        working-directory: src/web
        run: pnpm run ci

      - name: Run typecheck
        working-directory: src/web
        run: pnpm run typecheck

      - name: Run knip
        working-directory: src/web
        run: pnpm run knip

      - name: Run tests
        working-directory: src/web
        run: pnpm test
