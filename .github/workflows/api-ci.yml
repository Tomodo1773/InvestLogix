name: API CI (Ruff)

on:
  push:
    branches: ["main"]
    paths:
      - "src/api/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
    paths:
      - "src/api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.21"

      - name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      # ruffのバージョンはuv.lockを唯一の情報源とする（CI・pre-commit・ローカルで揃える）
      # リント目的なのでランタイム依存は入れず、ruffを含むdevグループのみ同期する
      - name: Install Ruff
        working-directory: src/api
        run: sfw uv sync --frozen --only-group dev

      # --no-sync がないと uv run が完全な依存に同期し直し、上の --only-group dev が無駄になる
      # line-lengthはpyproject.tomlの[tool.ruff]から読まれる
      - name: Run Ruff Check
        working-directory: src/api
        run: uv run --no-sync ruff check

      - name: Run Ruff Format Check
        working-directory: src/api
        run: uv run --no-sync ruff format --check --diff
