name: Claude Code（Opus）

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == 'Tomodo1773' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@opus')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@opus')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@opus')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@opus') || contains(github.event.issue.title, '@opus')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv and Python
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.21"
          python-version: "3.11"
          ignore-nothing-to-cache: true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@opus"
          settings: |
            {
              "model": "claude-opus-4-5",
              "language": "Japanese",
              "permissions": {
                "allow": [
                  "Bash(uv add:*)",
                  "Bash(uv sync:*)",
                  "Bash(uv run ruff:*)",
                  "Bash(uv run pytest:*)",
                  "WebSearch",
                  "WebFetch",
                  "Skill(add-npm-package)",
                  "Skill(add-python-package)",
                  "Skill(api-test-creator)",
                  "Skill(web-test-creator)",
                  "Bash(pnpm add:*)",
                  "Bash(pnpm install)",
                  "Bash(pnpm check:*)",
                  "Bash(pnpm build)",
                  "Bash(pnpm test:*)",
                  "Bash(npx shadcn@latest add:*)"
                ]
              },
              "env": {
                "JQUANTS_API_KEY": "${{ secrets.JQUANTS_API_KEY }}"
              }
            }
