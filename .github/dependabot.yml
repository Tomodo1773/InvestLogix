version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/src/api"
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "uv"
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
      include: "scope"
  # GitHub Actionsの更新設定
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # すべてのGitHub Actionsを1つのPRにグループ化
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"