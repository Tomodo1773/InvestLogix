name: API CD (Cloud Run)

on:
  push:
    branches: ["main"]
    paths:
      - "src/api/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE: ${{ vars.IMAGE_BASE }}:${{ github.sha }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.SERVICE_NAME }}
  # infra/locals.tf の jobs map と同期させること
  JOBS: "recalc-holdings update-and-notify notify-weekly-performance"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build & push image
        working-directory: src/api
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run Service & Jobs
        run: |
          gcloud run deploy "$SERVICE" --image="$IMAGE" --region="$REGION" --quiet
          for job in $JOBS; do
            gcloud run jobs update "$job" --image="$IMAGE" --region="$REGION" --quiet
          done

      - name: Verify image SHA
        run: |
          fail=0
          check() {
            local kind=$1 name=$2 path=$3
            local actual
            actual=$(gcloud run "$kind" describe "$name" --region="$REGION" --format="value($path)")
            if [ "$actual" = "$IMAGE" ]; then
              echo "OK  $kind $name"
            else
              echo "NG  $kind $name -> $actual" >&2
              fail=1
            fi
          }
          check services "$SERVICE" "spec.template.spec.containers[0].image"
          for job in $JOBS; do
            check jobs "$job" "spec.template.spec.template.spec.containers[0].image"
          done
          exit $fail
