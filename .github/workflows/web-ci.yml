name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/web/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
    paths:
      - "src/web/**"

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI (lint + format)
        working-directory: src/web
        run: pnpm run ci

      - name: Run typecheck
        working-directory: src/web
        run: pnpm run typecheck

      - name: Run knip
        working-directory: src/web
        run: pnpm run knip
