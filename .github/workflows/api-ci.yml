name: API CI (Ruff)

on:
  push:
    branches: ["main"]
    paths:
      - "src/api/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
    paths:
      - "src/api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Socket Firewall
        uses: socketdev/action@937f824ec476dfd164d4a4d9995751427b0be143 # v1
        with:
          mode: firewall

      - name: Install dependencies
        run: |
          sfw pip install --upgrade pip
          sfw pip install ruff==0.9.1

      - name: Run Ruff Check
        working-directory: src/api
        run: ruff check --line-length=110

      - name: Run Ruff Format Check
        working-directory: src/api
        run: ruff format --check --diff --line-length=110
