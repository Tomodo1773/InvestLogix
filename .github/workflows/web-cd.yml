name: Web CD (Cloudflare Workers)

on:
  push:
    branches: ["main"]
    paths:
      - "src/web/**"
      - ".github/workflows/web-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

# デプロイの追い越しを防ぐ。走行中のものはキャンセルしない
concurrency:
  group: web-cd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: src/web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "src/web/pnpm-lock.yaml"

      - name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install dependencies
        working-directory: src/web
        run: sfw pnpm install --frozen-lockfile

      # Worker が壊れると /api/* のプロキシごと落ちるため、デプロイ前に必ず型検査する
      - name: Run typecheck
        working-directory: src/web
        run: pnpm run typecheck

      - name: Build
        working-directory: src/web
        run: pnpm run build

      # API_ORIGIN は `wrangler secret put` でCloudflare側に登録済み。
      # wrangler deploy は既存 secret を上書きしないため、ここでは渡さない
      - name: Deploy to Cloudflare Workers
        working-directory: src/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
