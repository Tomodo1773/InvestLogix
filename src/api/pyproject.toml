[project]
name = "stock"
version = "0.1.0"
description = "Investment Management API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.51.0",
    "python-jose[cryptography]>=3.5.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "alembic>=1.18.5",
    "asyncpg>=0.28.0",
    "pytz>=2026.3.post1",
    "aiosqlite>=0.21.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.14.1",
    "jquants-api-client>=2.3.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.3.4",
    "loguru>=0.7.3",
    "setuptools>=83.0.0",
    "openai>=2.48.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
# Allow lines to be as long as 110.
line-length = 110

[tool.setuptools]
packages = ["stock", "alembic"]
