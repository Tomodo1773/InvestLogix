[project]
name = "stock"
version = "0.1.0"
description = "Investment Management API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
    "python-jose[cryptography]>=3.5.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "alembic>=1.19.1",
    "asyncpg>=0.28.0",
    "pytz>=2026.3.post1",
    "aiosqlite>=0.21.0",
    "pydantic-settings>=2.15.0",
    "jquants-api-client>=2.4.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.3.4",
    "loguru>=0.7.3",
    "setuptools>=84.0.0",
    "openai>=2.54.0",
    "mcp>=2.0.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
# Allow lines to be as long as 110.
line-length = 110

# ruff 0.16.0でデフォルトルールが59→413に拡張された。上流のキュレーションを基本的に受け入れ、
# プロジェクト固有の事情があるものだけ以下で調整する。判断の経緯は docs/adr/0002-ruff-default-ruleset-adoption.md
[tool.ruff.lint]
# TID251は設定が前提のためデフォルトでは無効。下のbanned-apiを有効化するために追加する
extend-select = ["TID251"]
ignore = [
    # 検出箇所はすべて外部API呼び出しやバッチのユーザー単位処理をcatchしてログ出力する意図的な境界処理。
    # ruffはログ出力の有無を判定しないため恒常的にノイズになる
    "BLE001",
    # `raise Exception(...)` の指摘自体は正当だが、修正にはカスタム例外クラスの設計が必要。
    # 恒久的な是認ではなく、設計が済んだ時点で再有効化を検討する
    "TRY002",
]

[tool.ruff.lint.per-file-ignores]
# naive datetimeを意図的に生成して変換結果を検証するテストがあるため
"tests/**" = ["DTZ001", "DTZ011"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 設定値の読み込みはstock.databaseのSettingsに一本化する（Issue #437）。
# 環境変数を直接読むと設定項目の一覧性と型検証が失われるため、機械的に禁止する
"os.getenv".msg = "設定値は stock.database の settings 経由で読むこと。新しい項目は Settings に定義する"
"os.environ".msg = "設定値は stock.database の settings 経由で読むこと。新しい項目は Settings に定義する"
"dotenv.load_dotenv".msg = ".envの読み込みはSettings（pydantic-settings）が行うため不要"

[tool.ruff.lint.flake8-bugbear]
# FastAPIの依存性注入は引数デフォルトで関数を呼ぶのが公式パターンなのでB008の対象外にする。
# ルール自体は有効なままにして、本来の可変デフォルト引数のバグは検出させる
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.setuptools]
packages = ["stock", "alembic"]
