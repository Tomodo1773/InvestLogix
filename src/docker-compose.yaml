name: investlogix

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: investlogix-db
    container_name: investlogix-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hogehoge
      POSTGRES_DB: investlogix
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: dockerfile.dev
    image: investlogix-api
    container_name: investlogix-api
    env_file:
      - ./api/.env
    environment:
      DB_HOST: db
    volumes:
      - ./api:/src
      - ./api/.dockervenv:/src/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /src

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: investlogix-web
    container_name: investlogix-web
    environment:
      # Viteのdev proxyの転送先。proxyを実行するのはwebコンテナ内のViteなので、
      # ホスト側のlocalhostではなくcomposeネットワークのサービス名で解決する
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    working_dir: /app
