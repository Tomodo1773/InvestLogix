version: 2
updates:
  # API - version updates
  - package-ecosystem: "uv"
    directory: "/src/api"
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "uv"
      - "version"
    groups:
      api-version:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps(api)"
      prefix-development: "deps(api)"

  # API - security updates
  - package-ecosystem: "uv"
    directory: "/src/api"
    open-pull-requests-limit: 2
    schedule:
      interval: daily
    labels:
      - "dependencies"
      - "uv"
      - "security"
    groups:
      api-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps(api)"
      prefix-development: "deps(api)"

  # Web - version updates
  - package-ecosystem: "npm"
    directory: "/src/web"
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "npm"
      - "version"
    groups:
      web-version:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps(web)"
      prefix-development: "deps(web)"

  # Web - security updates
  - package-ecosystem: "npm"
    directory: "/src/web"
    open-pull-requests-limit: 2
    schedule:
      interval: daily
    labels:
      - "dependencies"
      - "npm"
      - "security"
    groups:
      web-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps(web)"
      prefix-development: "deps(web)"

  # GitHub Actions - version updates
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "github-actions"
      - "version"
    groups:
      github-actions-version:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps(github-actions)"
      prefix-development: "deps(github-actions)"

  # GitHub Actions - security updates
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: daily
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps(github-actions)"
      prefix-development: "deps(github-actions)"
