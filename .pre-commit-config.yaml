repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. src/api/uv.lock のruffと揃える
    rev: v0.16.0
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  # Frontend checks (src/web)
  - repo: local
    hooks:
      - id: pnpm-check
        name: pnpm check (src/web)
        entry: bash -c 'cd src/web && pnpm check'
        language: system
        files: ^src/web/
        pass_filenames: false
