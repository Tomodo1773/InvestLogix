# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "src/api/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python version
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Create requirements.txt from uv.lock
        run: |
          cd src/api
          python -m pip install --upgrade pip
          pip install --no-cache-dir uv
          uv export --format requirements-txt --no-editable > requirements.txt

      - name: Install dependencies with Poetry
        run: |
          cd src/api
          python -m venv antenv
          source antenv/bin/activate
          pip install --no-cache-dir -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          cd src/api
          zip release.zip ./* -r
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v6
        with:
          name: python-app
          path: |
            src/api/release.zip
            !src/api/venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F3526B69D3CA4A51801553039BF7E6EB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DA050D47B16D47ABA436C1F2A29A7A69 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_05A08B69DE9E407990A494D8D6A04C2E }}

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ secrets.AZUREAPPSERVICE_NAME }}
          slot-name: "Production"
