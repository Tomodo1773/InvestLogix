[project]
name = "stock"
version = "0.1.0"
description = "Investment Management API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.22.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "alembic>=1.11.0",
    "asyncpg>=0.28.0",
    "pytz>=2025.1",
    "aiosqlite>=0.21.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.7.1",
    "jquants-api-client>=2.0.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.3",
    "pandas>=2.2.3",
    "psycopg2-binary>=2.9.10",
    "psycopg>=3.2.4",
    "loguru>=0.7.3",
    "setuptools>=82.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9.5",
    "testcontainers[postgres]>=4.9.1",
]

[tool.ruff]
# Allow lines to be as long as 110.
line-length = 110

[tool.setuptools]
packages = ["stock", "alembic"]
