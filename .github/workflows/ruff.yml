name: Ruff

on:
  push:
    branches: ["main"]
    paths:
      - 'src/api/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
    paths:
      - 'src/api/**'

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.9.1

      - name: Run Ruff Check
        working-directory: src/api
        run: ruff check --line-length=110

      - name: Run Ruff Format Check
        working-directory: src/api
        run: ruff format --check --diff --line-length=110
